<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brother Kingdom | Biblioteca</title><style>body{margin:0;background:#172335;color:white;font:16px system-ui}header{padding:12px}select,button{max-width:100%;padding:8px;margin:4px}canvas{display:block}</style><header><b>Brother Kingdom | Biblioteca 3D</b><br><select id="asset"></select><select id="clip"></select><button id="spin">Girar / detener</button><span id="status"></span></header><script src="js/three.min.js"></script><script src="js/GLTFLoader.js"></script><script src="js/tk-bk-assets.js"></script><script>
const T=THREE,s=new T.Scene(),c=new T.PerspectiveCamera(40,1,.01,10000),r=new T.WebGLRenderer({antialias:true});document.body.appendChild(r.domElement);s.background=new T.Color(0x172335);s.add(new T.HemisphereLight(0xffffff,0x706050,1.5));const light=new T.DirectionalLight(0xffffff,2);light.position.set(4,8,5);s.add(light);const asset=document.getElementById('asset'),clip=document.getElementById('clip'),status=document.getElementById('status');let items=[],model,mixer,animations=[],serial=0,angle=.6,spin=true,dist=5,center=new T.Vector3();const clock=new T.Clock();function play(){if(!mixer)return;mixer.stopAllAction();if(animations[clip.value])mixer.clipAction(animations[clip.value]).reset().play();}async function load(){const token=++serial,e=items[asset.value];status.textContent=' Cargando';try{const g=await BKAssets.load(e.grupo,e.id);if(token!==serial)return;if(model){if(mixer){mixer.stopAllAction();mixer.uncacheRoot(model);}s.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [].concat(o.material))m.dispose();}});}model=g.scene;s.add(model);const b=new T.Box3().setFromObject(model);b.getCenter(center);dist=Math.max(.5,b.getSize(new T.Vector3()).length()*1.4);mixer=new T.AnimationMixer(model);animations=g.animations;clip.replaceChildren(...animations.map((a,i)=>new Option(a.name,i)));play();status.textContent=' '+animations.length+' clips';}catch(e){if(token===serial)status.textContent=' Error: '+e.message;}}asset.onchange=load;clip.onchange=play;document.getElementById('spin').onclick=()=>spin=!spin;function resize(){let h=Math.max(180,innerHeight-document.querySelector('header').offsetHeight);r.setSize(innerWidth,h);c.aspect=innerWidth/h;c.updateProjectionMatrix();}addEventListener('resize',resize);resize();BKAssets.list().then(x=>{items=x;asset.replaceChildren(...x.map((a,i)=>new Option(a.grupo+' / '+a.id,i)));load();}).catch(e=>status.textContent=e.message);function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clock.getDelta());if(spin)angle+=dt*.3;if(mixer)mixer.update(dt);c.position.set(center.x+Math.sin(angle)*dist,center.y+dist*.55,center.z+Math.cos(angle)*dist);c.lookAt(center);r.render(s,c);}frame();</script></html>
