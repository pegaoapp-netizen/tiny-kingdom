<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brother Kingdom | Ejército</title><style>body{margin:0;background:#142032;color:#fff;font:16px system-ui}header{padding:12px}select,button{padding:9px;margin:3px}canvas{display:block}</style><header><strong>Brother Kingdom · Army Pack</strong><br><select id="unit"><option>espadachin</option><option>arquero</option><option>lancero</option><option>caballero</option><option>mago</option></select><select id="clip"></select><button id="bones">Huesos</button><span id="status"></span></header><script src="js/three.min.js"></script><script src="js/GLTFLoader.js"></script><script>
const T=THREE, scene=new T.Scene(), camera=new T.PerspectiveCamera(38,1,.05,50), renderer=new T.WebGLRenderer({antialias:true});document.body.appendChild(renderer.domElement);scene.background=new T.Color(0x142032);scene.add(new T.HemisphereLight(0xffffff,0x504030,1));const light=new T.DirectionalLight(0xffffff,1);light.position.set(3,5,4);scene.add(light,new T.GridHelper(6,12));const unit=document.getElementById('unit'),clip=document.getElementById('clip'),status=document.getElementById('status');let model,mixer,helper,clips=[],serial=0;const clock=new T.Clock();function play(){if(!mixer)return;mixer.stopAllAction();const c=clips.find(x=>x.name===clip.value);if(!c)return;const a=mixer.clipAction(c);a.reset();if(['Morir','Atacar','RecibirDano','Victoria'].includes(c.name)){a.setLoop(T.LoopOnce,1);a.clampWhenFinished=true;}a.play();}function load(){const id=++serial;status.textContent=' Cargando…';new T.GLTFLoader().load('modelos/bk_army_v1/'+unit.value+'.glb',g=>{if(id!==serial)return;if(model)scene.remove(model);if(helper)scene.remove(helper);model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});helper=new T.SkeletonHelper(model);helper.visible=false;scene.add(helper);mixer=new T.AnimationMixer(model);clips=g.animations;clip.replaceChildren(...clips.map(c=>new Option(c.name,c.name)));clip.value='Reposo';play();status.textContent=' '+clips.length+' clips';},undefined,e=>{if(id===serial)status.textContent=' Error de carga';});}unit.onchange=load;clip.onchange=play;document.getElementById('bones').onclick=()=>{if(helper)helper.visible=!helper.visible;};function resize(){const h=Math.max(180,innerHeight-document.querySelector('header').offsetHeight);renderer.setSize(innerWidth,h);camera.aspect=innerWidth/h;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();load();let t=0;function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);t+=dt;if(mixer)mixer.update(dt);camera.position.set(Math.sin(t*.2)*4.8,2,Math.cos(t*.2)*4.8);camera.lookAt(0,1.2,0);renderer.render(scene,camera);}frame();</script></html>
