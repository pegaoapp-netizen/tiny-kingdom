<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brother Kingdom · Edificios</title><style>body{margin:0;background:#172337;color:white;font:16px system-ui}header{padding:12px}select{padding:8px}canvas{display:block}</style><header>Brother Kingdom · Edificios <select id="unit"></select> <span id="status"></span></header><script src="js/three.min.js"></script><script src="js/GLTFLoader.js"></script><script>
const T=THREE,s=new T.Scene(),c=new T.PerspectiveCamera(40,1,.1,100),r=new T.WebGLRenderer({antialias:true});document.body.appendChild(r.domElement);s.background=new T.Color(0x172337);s.add(new T.HemisphereLight(0xffffff,0x504030,1.5),new T.GridHelper(20,20));const l=new T.DirectionalLight(0xffffff,1.4);l.position.set(5,10,4);s.add(l);const u=document.getElementById('unit'),status=document.getElementById('status');let model,serial=0;for(const k of 'castillo muralla torre cuartel herreria mercado vivienda granja torre_magica establo templo aserradero'.split(' '))u.add(new Option(k,k));function load(){const id=++serial;status.textContent='Cargando';new T.GLTFLoader().load('modelos/bk_buildings_v1/'+u.value+'.glb',g=>{if(id!==serial)return;if(model)s.remove(model);model=g.scene;s.add(model);status.textContent='Listo';},undefined,()=>{if(id===serial)status.textContent='Error de carga';});}u.onchange=load;function resize(){const h=Math.max(200,innerHeight-document.querySelector('header').offsetHeight);r.setSize(innerWidth,h);c.aspect=innerWidth/h;c.updateProjectionMatrix();}addEventListener('resize',resize);resize();load();function frame(ms){requestAnimationFrame(frame);const a=ms*.0002;c.position.set(15*Math.sin(a),11,15*Math.cos(a));c.lookAt(0,2,0);r.render(s,c);}requestAnimationFrame(frame);
