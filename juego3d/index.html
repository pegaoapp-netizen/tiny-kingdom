<script>
// Si algo falla al arrancar, lo mostramos en pantalla (para poder arreglarlo)
window.__errores = [];
window.addEventListener("error", function (e) {
  window.__errores.push((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
  var t = document.getElementById("pantalla-texto");
  if (t && !window.__juegoListo) {
    t.innerHTML = "<b style=\"color:#b3261e\">El juego no pudo arrancar / The game could not start</b><br><small style=\"word-break:break-all\">" +
      window.__errores.join("<br>").replace(/</g, "&lt;") + "</small>";
  }
});
</script>
<title>Tiny Kingdom</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/oscuro.css">
</head>

<div id="flotantes"></div>
<div id="relojes"></div>

<div id="barra-obra" class="oculto"><span id="bo-txt"></span><button id="bo-acelerar">⏩</button></div>

<!-- Barra de arriba: perfil y recursos -->
