# =====================================================================
#  Codemagic: arma la app de iPhone de Tiny Kingdom y la sube a TestFlight.
#  Antes de la primera build, cambia los 2 valores marcados con  <-- CAMBIAR
# =====================================================================
workflows:
  ios-app-store:
    name: Tiny Kingdom - iPhone (App Store)
    max_build_duration: 30
    # Se compila sola cuando Claude sube el juego a la rama "apps" (git push origin HEAD:apps).
    # Los cambios normales del juego (rama main) NO gastan minutos de Codemagic.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'apps'
          include: true
          source: true
    instance_type: mac_mini_m2

    integrations:
      # Nombre de tu clave de App Store Connect en Codemagic
      # (Codemagic -> Team settings -> Integrations -> Developer Portal).
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pegao.tinykingdom
      vars:
        # "Apple ID" de la app: App Store Connect -> tu app -> Información de la app.
        APP_STORE_APPLE_ID: 6826971598
        XCODE_PROJECT: app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20
      xcode: 27.2 # Apple exige el SDK de iOS 27 desde abril de 2027 («latest» daba la 26.6)

    scripts:
      - name: Instalar Capacitor
        script: |
          cd app
          npm install --no-audit --no-fund
      - name: Copiar el juego dentro de la app
        script: |
          cd app
          npm run sync
      - name: Poner las firmas de Apple
        script: |
          xcode-project use-profiles
      - name: Subir el número de build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd app/ios/App
          agvtool new-version -all $(($ULTIMO + 1))
      - name: Construir la app (.ipa)
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # =====================================================================
  #  ANDROID (Google Play): arma el .aab firmado para subirlo a Play Console.
  #  Antes de la primera build: en Codemagic -> Team settings -> Code signing
  #  identities -> Android keystores, crea (Generate) una llave llamada
  #  tinykingdom_upload  (guárdala bien: sin ella no se pueden subir versiones nuevas).
  # =====================================================================
  android-google-play:
    name: Tiny Kingdom - Android (Google Play)
    max_build_duration: 30
    # Se compila sola cuando Claude sube el juego a la rama "apps" (git push origin HEAD:apps).
    # Los cambios normales del juego (rama main) NO gastan minutos de Codemagic.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'apps'
          include: true
          source: true
    instance_type: linux_x2

    environment:
      android_signing:
        - tinykingdom_upload
      node: 20
      java: 21

    scripts:
      - name: Instalar Capacitor (con Android)
        script: |
          cd app
          npm install --no-audit --no-fund
          npm install --no-save @capacitor/android@^7.6.9
      - name: Crear el proyecto Android y copiar el juego
        script: |
          cd app
          node scripts/copiar-web.js
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          # Google Play (protección automática) exige minSdk 24 o más; Capacitor trae 23
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          # Google Play exige targetSdk 36 (Android 16)
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle
          grep -q suppressUnsupportedCompileSdk android/gradle.properties || echo 'android.suppressUnsupportedCompileSdk=36' >> android/gradle.properties
          cat android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
      - name: Icono y pantalla de carga
        script: |
          cd app
          npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#2a1a10' --splashBackgroundColor '#2a1a10'
      - name: Número de versión
        script: |
          VERSION=$(grep -o "VERSION_JUEGO = '[0-9.]*'" juego3d/js/datos.js | grep -o "[0-9.]*" | head -1)
          cd app/android/app
          sed -i "s/versionCode [0-9]*/versionCode $((BUILD_NUMBER + 1))/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION:-1.0}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle
      - name: Construir el .aab
        script: |
          cd app/android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Firmar el .aab
        script: |
          cd app/android/app/build/outputs/bundle/release
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" \
            app-release.aab "$CM_KEY_ALIAS"
          mv app-release.aab tiny-kingdom.aab

    artifacts:
      - app/android/app/build/outputs/bundle/release/*.aab
